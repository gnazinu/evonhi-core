name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  library:
    name: evo-core (lint • build • import • deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff pip-audit

      - name: Lint (ruff)
        run: ruff check evonhi_core/

      - name: Import smoke test
        run: |
          python - <<'PY'
          from evonhi_core.graph_builder import build_attack_graph
          from evonhi_core.path_analysis import find_attack_paths
          from evonhi_core.optimizer import optimize_actions
          print("evo-core imports OK")
          PY

      - name: Run tests (if any)
        run: |
          if ls tests/*.py >/dev/null 2>&1 || ls **/test_*.py >/dev/null 2>&1; then
            pip install pytest && pytest -q
          else
            echo "no tests yet"
          fi

      - name: Dependency vulnerability scan
        run: pip-audit || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
